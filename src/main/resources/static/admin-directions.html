<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试方向管理</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 1200px;
            color: #172033;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                    radial-gradient(circle at 8% 8%, rgba(37, 99, 235, 0.16), transparent 30%),
                    radial-gradient(circle at 88% 12%, rgba(124, 58, 237, 0.14), transparent 28%),
                    linear-gradient(135deg, #f7faff 0%, #eef4ff 55%, #f8f6ff 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                    linear-gradient(rgba(37, 99, 235, 0.045) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(37, 99, 235, 0.045) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72), transparent 78%);
        }

        .app {
            position: relative;
            width: 1180px;
            margin: 0 auto;
            padding: 30px 0 40px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
            padding: 22px 24px;
            color: #fff;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 64, 175, 0.88));
            border: 1px solid rgba(191, 219, 254, 0.22);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(30, 64, 175, 0.18);
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: -0.03em;
        }

        .page-header .muted {
            color: #cbd5e1;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .layout.editing {
            grid-template-columns: minmax(0, 1fr) 390px;
        }

        .card {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(226, 232, 240, 0.88);
            border-radius: 22px;
            box-shadow: 0 18px 48px rgba(83, 105, 145, 0.10);
            backdrop-filter: blur(14px);
        }

        .tree-card {
            overflow: hidden;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 22px 14px;
            border-bottom: 1px solid #e8eef8;
        }

        .card-head h2,
        .form-card h2 {
            margin: 0;
        }

        .tree-tools {
            display: flex;
            gap: 8px;
        }

        .tree-body {
            max-height: calc(100vh - 230px);
            min-height: 560px;
            overflow: auto;
            padding: 14px 18px 20px;
        }

        .form-card {
            position: sticky;
            top: 24px;
            padding: 22px;
        }

        .hidden {
            display: none;
        }

        h1, h2, h3 {
            margin: 0 0 12px;
        }

        .muted {
            color: #68758f;
            font-size: 14px;
            line-height: 1.7;
        }

        .tree-node {
            margin-top: 10px;
        }

        .tree-row {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #e5eaf3;
            border-radius: 15px;
            background: rgba(251, 253, 255, 0.92);
            transition: border 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .tree-row:hover {
            transform: translateY(-1px);
            border-color: #bfdbfe;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.10);
        }

        .tree-row.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .tree-row.disabled {
            opacity: 0.55;
        }

        .tree-toggle {
            width: 28px;
            min-width: 28px;
            height: 28px;
            margin: 0;
            padding: 0;
            color: #1d4ed8;
            background: #dbeafe;
            border-radius: 10px;
            font-size: 14px;
        }

        .tree-toggle.empty {
            visibility: hidden;
        }

        .tree-main {
            min-width: 0;
            cursor: pointer;
        }

        .tree-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tree-name {
            overflow: hidden;
            color: #0f172a;
            font-weight: 800;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            flex: 0 0 auto;
            padding: 3px 8px;
            color: #1d4ed8;
            background: #dbeafe;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .badge.disabled {
            color: #64748b;
            background: #e2e8f0;
        }

        .tree-meta {
            margin-top: 4px;
            overflow: hidden;
            color: #64748b;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-count {
            color: #64748b;
            font-size: 13px;
            white-space: nowrap;
        }

        .tree-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tree-edit {
            padding: 7px 12px;
            color: #1e40af;
            background: #eef2ff;
            font-size: 13px;
        }

        .tree-children {
            margin-left: 24px;
            padding-left: 16px;
            border-left: 1px dashed #cbd5e1;
        }

        .empty-state {
            padding: 40px 16px;
            text-align: center;
            color: #64748b;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            background: #f8fbff;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 800;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d9dfeb;
            border-radius: 12px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16);
        }

        textarea {
            min-height: 96px;
            resize: vertical;
            line-height: 1.6;
        }

        button {
            margin-top: 0;
            padding: 11px 14px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.16);
        }

        button.secondary {
            background: #eef2ff;
            color: #1e40af;
        }

        button.ghost {
            background: rgba(255, 255, 255, 0.12);
            color: #dbeafe;
            border: 1px solid rgba(191, 219, 254, 0.20);
        }

        button.danger {
            background: #dc2626;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<main class="app">
    <section class="page-header">
        <div>
            <h1>面试方向管理</h1>
            <p class="muted">最多支持 3 层方向树。默认收起叶子节点，方向很多时可以逐层展开维护。</p>
        </div>
        <div class="header-actions">
            <button class="ghost" onclick="showCreateForm()">新增方向</button>
            <button class="ghost" onclick="location.href='index.html'">返回首页</button>
        </div>
    </section>

    <div id="pageLayout" class="layout">
        <section class="card tree-card">
            <div class="card-head">
                <div>
                    <h2>方向树</h2>
                    <p class="muted">点击节点可选中查看层级，只有点击“编辑”按钮才打开表单。</p>
                </div>
                <div class="tree-tools">
                    <button class="secondary" onclick="expandToLevel(2)">展开到二级</button>
                    <button class="secondary" onclick="collapseAll()">全部收起</button>
                </div>
            </div>
            <div id="tree" class="tree-body"></div>
        </section>

        <section id="directionForm" class="card form-card hidden">
            <h2 id="formTitle">新增方向</h2>
            <input type="hidden" id="directionId">

            <label>父级方向</label>
            <select id="parentId"></select>
            <p class="muted">新增顶层赛道时选择“无父级”。编辑时暂不调整父级。</p>

            <label>方向名称</label>
            <input id="name" placeholder="例如：Java 后端开发">

            <label>排序值</label>
            <input id="sortOrder" type="number" value="0">

            <label>状态</label>
            <select id="enabled">
                <option value="true">启用</option>
                <option value="false">禁用</option>
            </select>

            <label>说明</label>
            <textarea id="description" placeholder="用于说明该方向覆盖的岗位和能力范围"></textarea>

            <div class="button-row">
                <button onclick="saveDirection()">保存</button>
                <button class="secondary" onclick="showCreateForm()">新增</button>
                <button class="danger" onclick="disableDirection()">禁用所选</button>
                <button class="secondary" onclick="hideForm()">取消</button>
            </div>
        </section>
    </div>
</main>

<script>
    let directionTree = [];
    let flatDirections = [];
    let expandedIds = new Set();
    let selectedDirectionId = null;
    let treeInitialized = false;

    window.addEventListener("DOMContentLoaded", loadTree);

    async function request(url, options = {}) {
        const response = await fetch(url, {
            headers: {"Content-Type": "application/json"},
            ...options
        });
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.message || "请求失败");
        }
        if (response.status === 204) {
            return null;
        }
        return response.json().catch(() => null);
    }

    async function loadTree() {
        directionTree = await request("/api/admin/interview-directions/tree");
        flatDirections = flatten(directionTree);
        if (!treeInitialized) {
            directionTree.forEach(node => expandedIds.add(node.id));
            treeInitialized = true;
        }
        renderTree();
        renderParentOptions();
    }

    function flatten(nodes, result = []) {
        nodes.forEach(node => {
            result.push(node);
            flatten(node.children || [], result);
        });
        return result;
    }

    function renderTree() {
        const tree = document.getElementById("tree");
        tree.innerHTML = "";
        if (directionTree.length === 0) {
            tree.innerHTML = `<div class="empty-state">暂无面试方向，点击右侧表单新增顶层赛道。</div>`;
            return;
        }
        directionTree.forEach(item => tree.appendChild(renderNode(item)));
    }

    function renderNode(item) {
        const hasChildren = (item.children || []).length > 0;
        const expanded = expandedIds.has(item.id);
        const node = document.createElement("div");
        node.className = "tree-node";

        const row = document.createElement("div");
        row.className = `tree-row${item.enabled ? "" : " disabled"}${selectedDirectionId === item.id ? " selected" : ""}`;

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = `tree-toggle${hasChildren ? "" : " empty"}`;
        toggle.textContent = expanded ? "－" : "＋";
        toggle.onclick = event => {
            event.stopPropagation();
            toggleExpand(item.id);
        };

        const main = document.createElement("div");
        main.className = "tree-main";
        main.onclick = () => selectDirection(item.id);
        main.innerHTML = `
            <div class="tree-title">
                <span class="tree-name">${escapeHtml(item.name)}</span>
                <span class="badge">${item.level}级</span>
                <span class="badge${item.enabled ? "" : " disabled"}">${item.enabled ? "启用" : "禁用"}</span>
            </div>
            <div class="tree-meta">${escapeHtml(item.description || "暂无说明")}｜排序 ${item.sortOrder || 0}</div>
        `;

        const count = document.createElement("div");
        count.className = "tree-count";
        count.textContent = hasChildren ? `${item.children.length} 个子方向` : "叶子方向";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "tree-edit";
        editButton.textContent = "编辑";
        editButton.onclick = event => {
            event.stopPropagation();
            editDirection(item);
        };

        const actions = document.createElement("div");
        actions.className = "tree-actions";
        actions.appendChild(count);
        actions.appendChild(editButton);

        row.appendChild(toggle);
        row.appendChild(main);
        row.appendChild(actions);
        node.appendChild(row);

        if (hasChildren && expanded) {
            const children = document.createElement("div");
            children.className = "tree-children";
            item.children.forEach(child => children.appendChild(renderNode(child)));
            node.appendChild(children);
        }

        return node;
    }

    function toggleExpand(id) {
        if (expandedIds.has(id)) {
            expandedIds.delete(id);
        } else {
            expandedIds.add(id);
        }
        renderTree();
    }

    function expandToLevel(level) {
        expandedIds.clear();
        flatDirections.filter(item => item.level < level).forEach(item => expandedIds.add(item.id));
        renderTree();
    }

    function collapseAll() {
        expandedIds.clear();
        renderTree();
    }

    function expandSelectedPath() {
        if (!selectedDirectionId) {
            alert("请先选择一个方向");
            return;
        }
        expandPath(selectedDirectionId);
        renderTree();
    }

    function expandPath(id) {
        let current = flatDirections.find(item => item.id === Number(id));
        while (current && current.parentId) {
            expandedIds.add(current.parentId);
            current = flatDirections.find(item => item.id === current.parentId);
        }
    }

    function renderParentOptions() {
        const parent = document.getElementById("parentId");
        parent.innerHTML = `<option value="">无父级（顶层赛道）</option>`;
        flatDirections.filter(item => item.level < 3).forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = `${"　".repeat(item.level - 1)}${item.name}`;
            parent.appendChild(option);
        });
    }

    function selectDirection(id) {
        selectedDirectionId = id;
        renderTree();
    }

    function editDirection(item) {
        selectedDirectionId = item.id;
        showForm();
        renderTree();
        document.getElementById("formTitle").innerText = "编辑方向";
        document.getElementById("directionId").value = item.id;
        document.getElementById("parentId").value = item.parentId || "";
        document.getElementById("parentId").disabled = true;
        document.getElementById("name").value = item.name;
        document.getElementById("sortOrder").value = item.sortOrder || 0;
        document.getElementById("enabled").value = String(item.enabled);
        document.getElementById("description").value = item.description || "";
    }

    function showCreateForm() {
        resetForm();
        showForm();
    }

    function showForm() {
        document.getElementById("directionForm").classList.remove("hidden");
        document.getElementById("pageLayout").classList.add("editing");
    }

    function hideForm() {
        resetForm();
        document.getElementById("directionForm").classList.add("hidden");
        document.getElementById("pageLayout").classList.remove("editing");
    }

    function resetForm() {
        selectedDirectionId = null;
        renderTree();
        document.getElementById("formTitle").innerText = "新增方向";
        document.getElementById("directionId").value = "";
        document.getElementById("parentId").value = "";
        document.getElementById("parentId").disabled = false;
        document.getElementById("name").value = "";
        document.getElementById("sortOrder").value = "0";
        document.getElementById("enabled").value = "true";
        document.getElementById("description").value = "";
    }

    async function saveDirection() {
        const id = document.getElementById("directionId").value;
        const payload = {
            parentId: toNullableNumber(document.getElementById("parentId").value),
            name: document.getElementById("name").value.trim(),
            sortOrder: Number(document.getElementById("sortOrder").value || 0),
            enabled: document.getElementById("enabled").value === "true",
            description: document.getElementById("description").value.trim()
        };
        if (!payload.name) {
            alert("方向名称不能为空");
            return;
        }
        try {
            if (id) {
                await request(`/api/admin/interview-directions/${id}`, {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
            } else {
                await request("/api/admin/interview-directions", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
            }
            hideForm();
            await loadTree();
        } catch (error) {
            alert(error.message);
        }
    }

    async function disableDirection() {
        const id = document.getElementById("directionId").value;
        if (!id) {
            alert("请先选择一个方向");
            return;
        }
        try {
            await request(`/api/admin/interview-directions/${id}`, {method: "DELETE"});
            hideForm();
            await loadTree();
        } catch (error) {
            alert(error.message);
        }
    }

    function toNullableNumber(value) {
        return value ? Number(value) : null;
    }

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
