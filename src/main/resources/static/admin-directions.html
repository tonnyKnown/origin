<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试方向管理</title>
    <style>
        /* 方向管理页面特有样式 */

        .tree-tools {
            display: flex;
            gap: 8px;
        }

        .badge {
            flex: 0 0 auto;
            padding: 3px 8px;
            color: #1d4ed8;
            background: #dbeafe;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .badge.disabled {
            color: #64748b;
            background: #e2e8f0;
        }

        .empty-state {
            padding: 40px 16px;
            text-align: center;
            color: #64748b;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            background: #f8fbff;
        }
    </style>
    <link rel="stylesheet" href="common-theme.css">
</head>
<body>
<main class="app">
    <section class="page-header">
        <div>
            <h1>面试方向管理</h1>
            <p class="muted">最多支持 3 层方向树。默认收起叶子节点，方向很多时可以逐层展开维护。</p>
        </div>
        <div class="header-actions">
            <button class="ghost" onclick="showCreateForm()">新增方向</button>
            <button class="ghost" onclick="location.href='index.html'">返回首页</button>
        </div>
    </section>

    <div id="pageLayout" class="layout-left-panel">
        <section class="card tree-card">
            <div class="card-head">
                <div>
                    <h2>方向树</h2>
                    <p class="muted">点击节点可选中查看层级，只有点击“编辑”按钮才打开表单。</p>
                </div>
                <div class="tree-tools">
                    <button class="secondary" onclick="expandToLevel(2)">展开到技术领域</button>
                    <button class="secondary" onclick="collapseAll()">全部收起</button>
                </div>
            </div>
            <div id="tree" class="tree-body"></div>
        </section>

        <section id="directionForm" class="card form-card hidden">
            <h2 id="formTitle">新增方向</h2>
            <input type="hidden" id="directionId">

            <label>父级方向</label>
            <select id="parentId"></select>
            <p class="muted">新增顶层赛道时选择“无父级”。编辑时暂不调整父级。</p>

            <label>方向名称</label>
            <input id="name" placeholder="例如：Java 后端开发">

            <label>排序值</label>
            <input id="sortOrder" type="number" value="0">

            <label>状态</label>
            <select id="enabled">
                <option value="true">启用</option>
                <option value="false">禁用</option>
            </select>

            <label>说明</label>
            <textarea id="description" placeholder="用于说明该方向覆盖的岗位和能力范围"></textarea>

            <div class="button-row">
                <button id="saveButton" onclick="saveDirection()">保存</button>
                <button class="secondary" onclick="showCreateForm()">新增</button>
                <button class="danger" onclick="disableDirection()">禁用所选</button>
                <button class="secondary" onclick="hideForm()">取消</button>
            </div>
        </section>
    </div>
</main>

<script>
    let directionTree = [];
    let flatDirections = [];
    let expandedIds = new Set();
    let selectedDirectionId = null;
    let treeInitialized = false;
    let savingDirection = false;

    window.addEventListener("DOMContentLoaded", loadTree);

    async function request(url, options = {}) {
        const response = await fetch(url, {
            headers: {"Content-Type": "application/json"},
            ...options
        });
        if (response.status === 204) {
            return null;
        }
        const result = await response.json().catch(() => ({code: 500, message: "解析失败"}));
        if (!response.ok || result.code !== 200) {
            throw new Error(result.message || "请求失败");
        }
        return result.data;
    }

    async function loadTree() {
        directionTree = await request("/api/interview-directions/admin/tree");
        flatDirections = flatten(directionTree);
        if (!treeInitialized) {
            directionTree.forEach(node => expandedIds.add(node.id));
            treeInitialized = true;
        }
        renderTree();
        renderParentOptions();
    }

    function flatten(nodes, result = []) {
        nodes.forEach(node => {
            result.push(node);
            flatten(node.children || [], result);
        });
        return result;
    }

    function renderTree() {
        const tree = document.getElementById("tree");
        tree.innerHTML = "";
        if (directionTree.length === 0) {
            tree.innerHTML = `<div class="empty-state">暂无面试方向，点击“新增方向”创建顶层赛道。</div>`;
            return;
        }
        directionTree.forEach(item => tree.appendChild(renderNode(item)));
    }

    function renderNode(item) {
        const hasChildren = (item.children || []).length > 0;
        const expanded = expandedIds.has(item.id);
        const node = document.createElement("div");
        node.className = "tree-node";

        const row = document.createElement("div");
        row.className = `tree-row${item.enabled ? "" : " disabled"}${selectedDirectionId === item.id ? " selected" : ""}`;

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = `tree-toggle${hasChildren ? "" : " empty"}`;
        toggle.textContent = expanded ? "－" : "＋";
        toggle.onclick = event => {
            event.stopPropagation();
            toggleExpand(item.id);
        };

        const main = document.createElement("div");
        main.className = "tree-main";
        main.onclick = () => selectDirection(item.id);
        main.innerHTML = `
            <div class="tree-title">
                <span class="tree-name">${escapeHtml(item.name)}</span>
                <span class="badge">${item.level}级</span>
                <span class="badge${item.enabled ? "" : " disabled"}">${item.enabled ? "启用" : "禁用"}</span>
            </div>
            <div class="tree-meta">${escapeHtml(item.description || "暂无说明")}｜排序 ${item.sortOrder || 0}</div>
        `;

        const count = document.createElement("div");
        count.className = "tree-count";
        count.textContent = hasChildren ? `${item.children.length} 个子方向` : "叶子方向";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "tree-edit";
        editButton.textContent = "编辑";
        editButton.onclick = event => {
            event.stopPropagation();
            editDirection(item);
        };

        const actions = document.createElement("div");
        actions.className = "tree-actions";
        actions.appendChild(count);
        if (item.level < 3) {
            const childButton = document.createElement("button");
            childButton.type = "button";
            childButton.className = "tree-edit";
            childButton.textContent = "新增子方向";
            childButton.onclick = event => {
                event.stopPropagation();
                showCreateForm(item);
            };
            actions.appendChild(childButton);
        }
        actions.appendChild(editButton);

        row.appendChild(toggle);
        row.appendChild(main);
        row.appendChild(actions);
        node.appendChild(row);

        if (hasChildren && expanded) {
            const children = document.createElement("div");
            children.className = "tree-children";
            item.children.forEach(child => children.appendChild(renderNode(child)));
            node.appendChild(children);
        }

        return node;
    }

    function toggleExpand(id) {
        if (expandedIds.has(id)) {
            expandedIds.delete(id);
        } else {
            expandedIds.add(id);
        }
        renderTree();
    }

    function expandToLevel(level) {
        expandedIds.clear();
        flatDirections.filter(item => item.level < level).forEach(item => expandedIds.add(item.id));
        renderTree();
    }

    function collapseAll() {
        expandedIds.clear();
        renderTree();
    }

    function expandSelectedPath() {
        if (!selectedDirectionId) {
            alert("请先选择一个方向");
            return;
        }
        expandPath(selectedDirectionId);
        renderTree();
    }

    function expandPath(id) {
        let current = flatDirections.find(item => item.id === Number(id));
        while (current && current.parentId) {
            expandedIds.add(current.parentId);
            current = flatDirections.find(item => item.id === current.parentId);
        }
    }

    function renderParentOptions() {
        const parent = document.getElementById("parentId");
        parent.innerHTML = `<option value="">无父级（顶层赛道）</option>`;
        flatDirections.filter(item => item.level < 3).forEach(item => {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = `${"　".repeat(item.level - 1)}${item.name}`;
            parent.appendChild(option);
        });
    }

    function selectDirection(id) {
        selectedDirectionId = id;
        renderTree();
    }

    function editDirection(item) {
        selectedDirectionId = item.id;
        showForm();
        renderTree();
        document.getElementById("formTitle").innerText = "编辑方向";
        document.getElementById("directionId").value = item.id;
        document.getElementById("parentId").value = item.parentId || "";
        document.getElementById("parentId").disabled = true;
        document.getElementById("name").value = item.name;
        document.getElementById("sortOrder").value = item.sortOrder || 0;
        document.getElementById("enabled").value = String(item.enabled);
        document.getElementById("description").value = item.description || "";
    }

    function showCreateForm(parentItem = null) {
        resetForm();
        if (parentItem) {
            selectedDirectionId = parentItem.id;
            document.getElementById("parentId").value = parentItem.id;
            renderTree();
        }
        showForm();
    }

    function showForm() {
        document.getElementById("directionForm").classList.remove("hidden");
        document.getElementById("pageLayout").classList.add("editing");
    }

    function hideForm() {
        resetForm();
        closeForm();
    }

    function closeForm() {
        document.getElementById("directionForm").classList.add("hidden");
        document.getElementById("pageLayout").classList.remove("editing");
    }

    function resetForm() {
        selectedDirectionId = null;
        renderTree();
        document.getElementById("formTitle").innerText = "新增方向";
        document.getElementById("directionId").value = "";
        document.getElementById("parentId").value = "";
        document.getElementById("parentId").disabled = false;
        document.getElementById("name").value = "";
        document.getElementById("sortOrder").value = "0";
        document.getElementById("enabled").value = "true";
        document.getElementById("description").value = "";
    }

    async function saveDirection() {
        if (savingDirection) {
            return;
        }
        const id = document.getElementById("directionId").value;
        const payload = {
            parentId: toNullableNumber(document.getElementById("parentId").value),
            name: document.getElementById("name").value.trim(),
            sortOrder: Number(document.getElementById("sortOrder").value || 0),
            enabled: document.getElementById("enabled").value === "true",
            description: document.getElementById("description").value.trim()
        };
        if (!payload.name) {
            alert("方向名称不能为空");
            return;
        }
        try {
            savingDirection = true;
            document.getElementById("saveButton").disabled = true;
            let savedDirection;
            if (id) {
                savedDirection = await request(`/api/interview-directions/admin/${id}`, {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
            } else {
                savedDirection = await request("/api/interview-directions/admin", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
            }
            selectedDirectionId = savedDirection?.id || Number(id);
            if (payload.parentId) {
                expandPath(payload.parentId);
                expandedIds.add(payload.parentId);
            } else if (selectedDirectionId) {
                expandPath(selectedDirectionId);
            }
            closeForm();
            await loadTree();
        } catch (error) {
            alert(error.message);
        } finally {
            savingDirection = false;
            document.getElementById("saveButton").disabled = false;
        }
    }

    async function disableDirection() {
        const id = document.getElementById("directionId").value;
        if (!id) {
            alert("请先选择一个方向");
            return;
        }
        try {
            await request(`/api/interview-directions/admin/${id}`, {method: "DELETE"});
            hideForm();
            await loadTree();
        } catch (error) {
            alert(error.message);
        }
    }

    function toNullableNumber(value) {
        return value ? Number(value) : null;
    }

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
