<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史面试记录</title>
    <style>
        /* 历史记录页面特有样式 */

        .app {
            width: 100%;
            min-height: 100vh;
            padding: 22px 24px;
        }

        .detail-card {
            display: flex;
            flex-direction: column;
        }

        #detailPanel {
            flex: 1;
            min-height: 0;
        }

        #historyList {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: calc(100vh - 232px);
        }

        @media (max-width: 760px) {
            .filter-bar {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="common-theme.css">
</head>
<body>
<main class="app">
    <div class="topbar">
        <div>
            <h1>历史面试记录</h1>
            <p class="muted">查看每次面试的总分、每题标准答案、你的回答和 AI 建议，也可以对单题重新回答。</p>
        </div>
        <button class="ghost" onclick="location.href='/'">返回面试首页</button>
    </div>

    <div class="layout-sidebar">
        <section class="card panel">
            <h2>面试列表</h2>
            <div class="filter-bar">
                <div class="filter-field">
                    <label for="directionLevel1Filter">职业赛道</label>
                    <select id="directionLevel1Filter" onchange="changeDirectionLevel1Filter()">
                        <option value="">全部赛道</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="directionLevel2Filter">技术领域</label>
                    <select id="directionLevel2Filter" onchange="changeDirectionFilter()" disabled>
                        <option value="">全部技术领域</option>
                    </select>
                </div>
            </div>
            <div class="direction-tree-card">
                <div class="direction-tree-head">
                    <div class="direction-tree-title">方向树概览</div>
                    <div class="direction-tree-subtitle">赛道 / 领域 / 岗位</div>
                </div>
                <div id="directionTreePreview" class="direction-tree-body">
                    <div class="muted">方向树加载中...</div>
                </div>
            </div>
            <p id="historyPageInfo" class="muted">按创建时间倒序展示，每页 10 条。</p>
            <div id="historyList"></div>
            <div id="historyPagination" class="pagination hidden">
                <button class="ghost" onclick="changeHistoryPage(-1)">上一页</button>
                <span id="historyPageText" class="muted"></span>
                <button class="ghost" onclick="changeHistoryPage(1)">下一页</button>
            </div>
        </section>

        <section class="card panel detail-card">
            <div id="detailEmpty" class="empty">请选择左侧一条历史记录查看详情。</div>
            <div id="detailPanel" class="hidden">
                <h2 id="detailTitle">面试详情</h2>
                <div class="summary-grid">
                    <div class="stat">
                        <div class="muted">总分</div>
                        <div><span id="totalScore" class="score">0</span> / 100</div>
                    </div>
                    <div class="stat">
                        <div class="muted">状态</div>
                        <h3 id="statusText">-</h3>
                    </div>
                    <div class="stat">
                        <div class="muted">开始时间</div>
                        <h3 id="createdAtText">-</h3>
                    </div>
                </div>

                <h3>整体评价</h3>
                <p id="overallComment"></p>
                <h3>提升建议</h3>
                <p id="improvementAdvice" class="collapsible-text collapsed" onclick="toggleCollapsibleText(this)"></p>

                <h3>每题明细</h3>
                <div id="questionTabs" class="question-tabs"></div>
                <div id="selectedQuestionDetail"></div>
            </div>
        </section>
    </div>
</main>

<script>
    let currentHistoryInterviewId = null;
    let currentHistoryDetail = null;
    let selectedQuestionId = null;
    let currentHistoryPage = 1;
    let currentDirectionFilter = "";
    let directionFilterTree = [];
    const historyPageSize = 10;

    window.addEventListener("DOMContentLoaded", async () => {
        await loadDirectionFilters();
        await loadHistory();
    });

    async function request(url, options = {}) {
        const response = await fetch(url, {
            headers: {"Content-Type": "application/json"},
            ...options
        });
        const result = await response.json().catch(() => ({code: 500, message: "解析失败"}));
        if (!response.ok || result.code !== 200) {
            throw new Error(result.message || "请求失败");
        }
        return result.data;
    }

    async function loadHistory() {
        try {
            const directionParam = currentDirectionFilter
                ? `&direction=${encodeURIComponent(currentDirectionFilter)}`
                : "";
            const data = await request(`/api/interview/history?page=${currentHistoryPage}&size=${historyPageSize}${directionParam}`);
            if (!data.records.length && data.total > 0 && currentHistoryPage > 1) {
                currentHistoryPage = data.totalPages;
                await loadHistory();
                return;
            }
            renderHistoryList(data.records);
            renderPagination(data);
            if (data.records.length) {
                await loadHistoryDetail(data.records[0].interviewId);
            } else {
                clearDetailPanel("暂无历史面试记录。");
            }
        } catch (error) {
            alert(error.message);
        }
    }

    async function loadDirectionFilters() {
        try {
            directionFilterTree = await request("/api/interview-directions/tree");
            const select = document.getElementById("directionLevel1Filter");
            select.innerHTML = `<option value="">全部赛道</option>`;
            directionFilterTree.forEach(item => {
                const option = document.createElement("option");
                option.value = item.name;
                option.textContent = item.name;
                select.appendChild(option);
            });
            const reviewOption = document.createElement("option");
            reviewOption.value = "REVIEW";
            reviewOption.textContent = "复习面试";
            select.appendChild(reviewOption);
            renderDirectionLevel2Filter([]);
            renderDirectionTreePreview();
        } catch (error) {
            console.warn("加载方向筛选失败", error);
            document.getElementById("directionTreePreview").innerHTML = `<div class="muted">方向树加载失败，请刷新重试。</div>`;
        }
    }

    function renderDirectionTreePreview() {
        const preview = document.getElementById("directionTreePreview");
        if (!directionFilterTree.length) {
            preview.innerHTML = `<div class="muted">暂无方向树数据。</div>`;
            return;
        }

        preview.innerHTML = directionFilterTree.map(track => {
            const children = track.children || [];
            const childHtml = children.map(child => {
                const leaves = child.children || [];
                const visibleLeaves = leaves.slice(0, 3);
                const leafHtml = visibleLeaves.map(leaf => `<span class="tree-leaf">${escapeHtml(leaf.name)}</span>`).join("");
                const moreHtml = leaves.length > visibleLeaves.length
                    ? `<span class="tree-more">+${leaves.length - visibleLeaves.length}</span>`
                    : "";
                return `
                    <div class="tree-branch">
                        <div class="tree-node"><span>${escapeHtml(child.name)}</span></div>
                        ${leaves.length ? `<div class="tree-leaves">${leafHtml}${moreHtml}</div>` : ""}
                    </div>
                `;
            }).join("");
            return `
                <div class="tree-track">
                    <div class="tree-node"><strong>${escapeHtml(track.name)}</strong></div>
                    ${childHtml}
                </div>
            `;
        }).join("");
    }

    async function changeDirectionLevel1Filter() {
        const level1Name = document.getElementById("directionLevel1Filter").value;
        if (!level1Name || level1Name === "REVIEW") {
            renderDirectionLevel2Filter([]);
        } else {
            const level1 = directionFilterTree.find(item => item.name === level1Name);
            renderDirectionLevel2Filter(level1 ? level1.children : []);
        }
        await changeDirectionFilter();
    }

    function renderDirectionLevel2Filter(directions) {
        const select = document.getElementById("directionLevel2Filter");
        select.innerHTML = `<option value="">全部技术领域</option>`;
        directions.forEach(item => {
            const option = document.createElement("option");
            option.value = item.name;
            option.textContent = item.name;
            select.appendChild(option);
        });
        select.disabled = directions.length === 0;
    }

    async function changeDirectionFilter() {
        currentDirectionFilter = buildDirectionFilterValue();
        currentHistoryPage = 1;
        clearDetailPanel("请选择左侧一条历史记录查看详情。");
        await loadHistory();
    }

    function buildDirectionFilterValue() {
        const level1Name = document.getElementById("directionLevel1Filter").value;
        const level2Name = document.getElementById("directionLevel2Filter").value;
        if (!level1Name) {
            return "";
        }
        if (level1Name === "REVIEW") {
            return "REVIEW";
        }
        return level2Name ? `${level1Name} / ${level2Name}` : level1Name;
    }

    function renderHistoryList(items) {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        if (!items.length) {
            list.innerHTML = `<div class="empty">暂无历史面试记录。</div>`;
            return;
        }

        groupHistoryByDirection(items).forEach(group => {
            const groupDiv = document.createElement("div");
            groupDiv.className = "direction-group";
            groupDiv.innerHTML = `
                <div class="direction-group-head">
                    <div class="direction-group-title">${escapeHtml(group.name)}</div>
                    <div class="direction-group-count">${group.items.length} 条</div>
                </div>
            `;
            const groupList = document.createElement("div");
            groupList.className = "direction-group-list";
            group.items.forEach(item => {
            const div = document.createElement("div");
            div.id = `historyItem-${item.interviewId}`;
            div.className = "history-card";
            div.title = `${formatPositionType(item.positionType)}｜${item.totalScore || 0}分｜${formatStatus(item.status)}`;
            div.onclick = () => loadHistoryDetail(item.interviewId);
            const continueButton = item.status === "RUNNING"
                ? `<button class="continue" title="继续面试" onclick="continueInterview(event, ${item.interviewId})">继续</button>`
                : "";
            div.innerHTML = `
                <h3>${escapeHtml(formatPositionTypeForCard(item.positionType))}</h3>
                <div class="history-score-row">
                    <span class="history-score">${item.totalScore || 0} 分</span>
                    <span class="history-status">${formatStatus(item.status)}</span>
                </div>
                <div class="meta">
                    ${formatTime(item.createdAt)} · ${formatTime(item.finishedAt)}
                </div>
                <div class="history-actions">
                    ${continueButton}
                    <button class="danger" title="删除" onclick="deleteHistory(event, ${item.interviewId})">×</button>
                </div>
            `;
                groupList.appendChild(div);
            });
            groupDiv.appendChild(groupList);
            list.appendChild(groupDiv);
        });
    }

    function groupHistoryByDirection(items) {
        const groupMap = new Map();
        items.forEach(item => {
            const groupName = getDirectionGroupName(item.positionType);
            if (!groupMap.has(groupName)) {
                groupMap.set(groupName, []);
            }
            groupMap.get(groupName).push(item);
        });
        return Array.from(groupMap.entries()).map(([name, groupItems]) => ({
            name,
            items: groupItems
        }));
    }

    function getDirectionGroupName(positionType) {
        if (positionType === "REVIEW") {
            return "复习面试";
        }
        const normalized = formatPositionType(positionType);
        return normalized.includes("/")
            ? normalized.split("/")[0].trim()
            : normalized;
    }

    function continueInterview(event, interviewId) {
        event.stopPropagation();
        location.href = `/?continueInterviewId=${interviewId}`;
    }

    function renderPagination(pageData) {
        const pagination = document.getElementById("historyPagination");
        const pageText = document.getElementById("historyPageText");
        const pageInfo = document.getElementById("historyPageInfo");
        if (!pageData.total) {
            pagination.classList.add("hidden");
            pageInfo.innerText = "暂无历史面试记录。";
            return;
        }
        pagination.classList.toggle("hidden", pageData.totalPages <= 1);
        pageText.innerText = `第 ${pageData.page} / ${pageData.totalPages} 页，共 ${pageData.total} 条`;
        pageInfo.innerText = `按创建时间倒序展示，每页 ${pageData.size} 条，共 ${pageData.total} 条。`;
        pagination.querySelector("button:first-child").disabled = pageData.page <= 1;
        pagination.querySelector("button:last-child").disabled = pageData.page >= pageData.totalPages;
    }

    async function changeHistoryPage(delta) {
        currentHistoryPage = Math.max(1, currentHistoryPage + delta);
        await loadHistory();
    }

    async function loadHistoryDetail(interviewId) {
        try {
            currentHistoryInterviewId = interviewId;
            const data = await request(`/api/interview/history/${interviewId}`);
            renderHistoryDetail(data);
            document.querySelectorAll(".history-card").forEach(item => item.classList.remove("active"));
            const active = document.getElementById(`historyItem-${interviewId}`);
            if (active) {
                active.classList.add("active");
            }
        } catch (error) {
            alert(error.message);
        }
    }

    async function deleteHistory(event, interviewId) {
        event.stopPropagation();
        const confirmed = confirm("确认要物理删除这条历史面试记录吗？删除后不可恢复。");
        if (!confirmed) {
            return;
        }
        try {
            const response = await fetch(`/api/interview/history/${interviewId}`, {method: "DELETE"});
            if (!response.ok) {
                throw new Error("删除失败");
            }
            if (currentHistoryInterviewId === interviewId) {
                clearDetailPanel("请选择左侧一条历史记录查看详情。");
            }
            await loadHistory();
        } catch (error) {
            alert(error.message || "删除失败");
        }
    }

    function clearDetailPanel(message) {
        currentHistoryInterviewId = null;
        currentHistoryDetail = null;
        selectedQuestionId = null;
        document.getElementById("detailPanel").classList.add("hidden");
        document.getElementById("detailEmpty").classList.remove("hidden");
        document.getElementById("detailEmpty").innerText = message;
    }

    function renderHistoryDetail(data) {
        document.getElementById("detailEmpty").classList.add("hidden");
        document.getElementById("detailPanel").classList.remove("hidden");
        document.getElementById("detailTitle").innerText = formatPositionType(data.positionType);
        document.getElementById("totalScore").innerText = data.totalScore || 0;
        document.getElementById("statusText").innerText = formatStatus(data.status);
        document.getElementById("createdAtText").innerText = formatTime(data.createdAt);
        document.getElementById("overallComment").innerText = data.overallComment || "暂无整体评价";
        const improvementAdvice = document.getElementById("improvementAdvice");
        improvementAdvice.innerText = data.improvementAdvice || "暂无提升建议";
        improvementAdvice.classList.add("collapsed");
        improvementAdvice.classList.remove("expanded");

        const previousSelectedQuestionId = selectedQuestionId;
        currentHistoryDetail = data;
        selectedQuestionId = data.questions.some(question => question.questionId === previousSelectedQuestionId)
            ? previousSelectedQuestionId
            : (data.questions.length ? data.questions[0].questionId : null);
        renderQuestionTabs();
        renderSelectedQuestionDetail();
    }

    function renderQuestionTabs() {
        const tabs = document.getElementById("questionTabs");
        tabs.innerHTML = "";
        if (!currentHistoryDetail || !currentHistoryDetail.questions.length) {
            tabs.innerHTML = `<div class="empty">暂无题目明细。</div>`;
            return;
        }

        currentHistoryDetail.questions.forEach(item => {
            const div = document.createElement("div");
            div.className = `question-tab ${item.questionId === selectedQuestionId ? "active" : ""}`;
            div.onclick = () => selectQuestion(item.questionId);
            div.innerHTML = `
                <div class="question-tab-title">第 ${item.questionIndex} 题</div>
                <div class="muted">${formatQuestionType(item.questionType)}</div>
                <div class="question-tab-score">${item.score}<span class="muted"> / 20</span></div>
            `;
            tabs.appendChild(div);
        });
    }

    function selectQuestion(questionId) {
        selectedQuestionId = questionId;
        renderQuestionTabs();
        renderSelectedQuestionDetail();
    }

    function renderSelectedQuestionDetail() {
        const detail = document.getElementById("selectedQuestionDetail");
        detail.innerHTML = "";
        if (!currentHistoryDetail || !selectedQuestionId) {
            return;
        }

        const item = currentHistoryDetail.questions.find(question => question.questionId === selectedQuestionId);
        if (!item) {
            return;
        }

        const div = document.createElement("div");
        div.className = "question-card";
        div.innerHTML = `
            <div class="question-title">
                <span>第 ${item.questionIndex} 题：${item.score} / 20</span>
                <span class="tag">${formatQuestionType(item.questionType)}</span>
            </div>
            <p><b>题目：</b>${escapeHtml(item.questionContent)}</p>
            <div class="answer-block"><b>标准答案：</b><br>${escapeHtml(item.referenceAnswer)}</div>
            <div class="answer-block"><b>你的回答：</b><br>${escapeHtml(item.userAnswer)}</div>
            <p><b>本题总结：</b>${escapeHtml(item.answerSummary)}</p>
            <p><b>AI点评：</b>${escapeHtml(item.aiComment)}</p>
            <p><b>改进建议：</b>${escapeHtml(item.suggestion)}</p>
            <button class="secondary" onclick="showReAnswerEditor(${item.questionId})">重新回答这道题</button>
            <div id="reanswerBox-${item.questionId}" class="reanswer-box hidden">
                <textarea id="reanswerText-${item.questionId}" placeholder="请输入这道题的新答案，提交后系统会重新评分。">${escapeHtml(item.userAnswer)}</textarea>
                <button onclick="submitReAnswer(${item.questionId})">提交重新评分</button>
                <button class="ghost" onclick="cancelReAnswer(${item.questionId})">取消</button>
            </div>
        `;
        detail.appendChild(div);
    }

    function toggleCollapsibleText(element) {
        element.classList.toggle("collapsed");
        element.classList.toggle("expanded");
    }

    function showReAnswerEditor(questionId) {
        document.getElementById(`reanswerBox-${questionId}`).classList.remove("hidden");
    }

    function cancelReAnswer(questionId) {
        document.getElementById(`reanswerBox-${questionId}`).classList.add("hidden");
    }

    async function submitReAnswer(questionId) {
        const textarea = document.getElementById(`reanswerText-${questionId}`);
        const userAnswer = textarea.value.trim();
        if (!userAnswer) {
            alert("请先输入新的答案");
            return;
        }
        try {
            const data = await request(`/api/interview/${currentHistoryInterviewId}/questions/${questionId}/answer`, {
                method: "PUT",
                body: JSON.stringify({userAnswer})
            });
            alert(`重新评分成功，本题 ${data.score} / 20，总分已更新为 ${data.totalScore} / 100`);
            selectedQuestionId = questionId;
            await loadHistoryDetail(currentHistoryInterviewId);
        } catch (error) {
            alert(error.message);
        }
    }

    function formatStatus(status) {
        const mapping = {
            FINISHED: "已完成",
            CANCELLED: "已取消",
            RUNNING: "进行中"
        };
        return mapping[status] || "进行中";
    }

    function formatQuestionType(type) {
        const mapping = {
            BASIC: "Java基础八股",
            CONCURRENCY: "JVM/并发八股",
            MIDDLEWARE: "数据库/缓存/中间件",
            PROJECT: "项目实战",
            ARCHITECTURE: "架构设计",
            REVIEW: "复习题"
        };
        return mapping[type] || "未分类";
    }

    function formatPositionType(positionType) {
        return positionType === "REVIEW" ? "复习（基于手动提问）" : positionType;
    }

    function formatPositionTypeForCard(positionType) {
        const normalized = formatPositionType(positionType);
        if (positionType === "REVIEW") {
            return normalized;
        }
        const parts = normalized.split("/").map(item => item.trim()).filter(Boolean);
        return parts.length >= 2 ? parts.slice(-2).join(" / ") : normalized;
    }

    function formatTime(value) {
        if (!value) {
            return "-";
        }
        return String(value).replace("T", " ").substring(0, 19);
    }

    function escapeHtml(value) {
        return String(value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
