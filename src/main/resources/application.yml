server:
  port: 8080
  # 默认只监听本机回环地址；如需对外暴露，设置环境变量 SERVER_ADDRESS=0.0.0.0（建议同时开启下方 app.auth.token）。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./application-local.yml
  application:
    name: ai-interview-system
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    # 注意：当前使用 sql.init 在每次启动时执行 schema.sql 建表/初始化数据。
    # 脚本已用 IF NOT EXISTS 与条件 ALTER 幂等化；这里关闭 continue-on-error 以暴露真实 SQL 错误。
    # 后续若引入 Flyway/Liquibase，应将 mode 改为 never 并交由迁移工具管理。
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  # 每场模拟面试的题目数量，可配置（默认 5）。
  interview:
    total-questions: ${APP_INTERVIEW_TOTAL_QUESTIONS:5}
  # 可选接口鉴权：留空表示关闭（本地开发）；设置后所有非静态请求需带 X-API-Token 头。
  auth:
    token: ${APP_AUTH_TOKEN:}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model-name: ${DEEPSEEK_MODEL:deepseek-chat}

logging:
  level:
    com.example.aiinterview: INFO
